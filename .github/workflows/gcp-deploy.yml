name: GCP deploy

# Builds the image with Cloud Build, pushes to Artifact Registry, and rolls a
# new Cloud Run revision. Authenticates with Workload Identity Federation (no
# long-lived JSON keys).
#
# Required GitHub configuration (Settings -> Secrets and variables -> Actions):
#
#   Secrets:
#     GCP_WORKLOAD_IDENTITY_PROVIDER  full resource name of the WIF provider,
#                                     e.g. projects/123/locations/global/workloadIdentityPools/github/providers/github
#     GCP_DEPLOY_SERVICE_ACCOUNT      email of the SA the workflow impersonates
#                                     (needs run.admin, cloudbuild.builds.editor,
#                                      artifactregistry.writer, iam.serviceAccountUser,
#                                      storage.admin on the build bucket)
#
#   Variables:
#     GCP_PROJECT_ID                  target project id
#     GCP_REGION                      e.g. asia-south1
#     GCP_AR_REPO                     Artifact Registry repo name (e.g. jatayu)
#     GCP_RUN_SERVICE                 Cloud Run service name (e.g. jatayu-web)
#     GCP_RUN_SERVICE_ACCOUNT         runtime SA email attached to the service
#     GCP_SQL_CONNECTION              Cloud SQL connection name PROJECT:REGION:INSTANCE
#     GCS_BUCKET                      media bucket name
#     NEXT_PUBLIC_SITE_URL            public origin (drives CORS/CSRF)
#
#   Secret Manager (in the project, not GitHub) must hold:
#     payload-secret, database-uri
#
# See docs/DEPLOY-GCP.md for the one-time resource setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for OIDC federation with Google Cloud.
permissions:
  id-token: write
  contents: read

concurrency:
  group: gcp-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPO: ${{ vars.GCP_AR_REPO }}
  SERVICE: ${{ vars.GCP_RUN_SERVICE }}
  RUN_SA: ${{ vars.GCP_RUN_SERVICE_ACCOUNT }}
  SQL_CONNECTION: ${{ vars.GCP_SQL_CONNECTION }}
  BUCKET: ${{ vars.GCS_BUCKET }}
  SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image with Cloud Build
        id: build
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::12}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}"
          gcloud builds submit \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --tag "${IMAGE}:${TAG}" \
            .
          # Also move the :latest tag to this build (non-fatal if it races).
          gcloud artifacts docker tags add "${IMAGE}:${TAG}" "${IMAGE}:latest" || true
          echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${{ steps.build.outputs.image }}" \
            --service-account "${RUN_SA}" \
            --allow-unauthenticated \
            --add-cloudsql-instances "${SQL_CONNECTION}" \
            --min-instances 1 \
            --cpu 1 --memory 1Gi \
            --set-env-vars "NODE_ENV=production,GCS_BUCKET=${BUCKET},NEXT_PUBLIC_SITE_URL=${SITE_URL}" \
            --set-secrets "PAYLOAD_SECRET=payload-secret:latest,DATABASE_URI=database-uri:latest"

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --format='value(status.url)')
          echo "App: ${URL}"
          echo "Admin: ${URL}/admin"
