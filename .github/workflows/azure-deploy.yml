name: Azure deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for OIDC federation with Azure AD.
permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: jatayu
  ENV_NAME: prod
  RG: rg-jatayu-prod
  APP_NAME: jatayu-prod-app
  IMAGE_REPO: jatayu-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR name from resource group
        id: acr
        run: |
          set -euo pipefail
          NAME=$(az acr list -g "$RG" --query '[0].name' -o tsv)
          if [ -z "$NAME" ]; then
            echo "::error ::No ACR found in $RG. Run infra/azure-deploy.sh from a workstation once for the initial bootstrap." >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          LOGIN_SERVER=$(az acr show -n "$NAME" --query loginServer -o tsv)
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Build and push image with ACR Tasks
        id: build
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::12}"
          az acr build \
            -r "${{ steps.acr.outputs.name }}" \
            -t "${IMAGE_REPO}:${TAG}" \
            -t "${IMAGE_REPO}:latest" \
            --file Dockerfile .
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Roll Container App revision
        run: |
          set -euo pipefail
          az containerapp update \
            -n "$APP_NAME" -g "$RG" \
            --image "${{ steps.acr.outputs.login_server }}/${IMAGE_REPO}:${{ steps.build.outputs.tag }}"

      - name: Print app URL
        run: |
          FQDN=$(az containerapp show -n "$APP_NAME" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          echo "App: https://$FQDN"
          echo "Admin: https://$FQDN/admin"
