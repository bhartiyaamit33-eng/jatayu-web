# =============================================================================
# Jatayu — Data Connect mutations
# =============================================================================
# Named write operations for the tables in ../schema/schema.gql.
# Each mutation becomes a type-safe function in the generated SDK.
#
# Data Connect auto-generates these write fields per @table type:
#   <type>_insert / <type>_update / <type>_upsert / <type>_delete
#   (field prefix = camelCase GraphQL type name, e.g. post_insert,
#    caseStudy_insert, useCaseSection_insert)
#
# @auth levels:
#   PUBLIC — anyone (used ONLY for the public lead capture form)
#   USER   — any signed-in Firebase Auth user (editors create/update content)
# =============================================================================


# ----------------------------- Leads (public capture) ------------------------
# Mirrors the public /api/trial route — anyone can create a lead.
mutation CreateLead(
  $fullName: String!
  $workEmail: String!
  $phone: String!
  $role: String!
  $hospitalOrCompany: String!
  $country: String!
  $specialty: String
  $consentTermsAcceptedAt: Date
  $consentIp: String
  $consentUserAgent: String
) @auth(level: PUBLIC) {
  lead_insert(
    data: {
      fullName: $fullName
      workEmail: $workEmail
      phone: $phone
      role: $role
      hospitalOrCompany: $hospitalOrCompany
      country: $country
      specialty: $specialty
      status: "new"
      source: "trial-form"
      consentTermsAcceptedAt: $consentTermsAcceptedAt
      consentIp: $consentIp
      consentUserAgent: $consentUserAgent
    }
  )
}

mutation UpdateLeadStatus($id: UUID!, $status: String!, $notes: String) @auth(level: USER) {
  lead_update(id: $id, data: { status: $status, notes: $notes })
}

mutation DeleteLead($id: UUID!) @auth(level: USER) {
  lead_delete(id: $id)
}


