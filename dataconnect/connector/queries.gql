# =============================================================================
# Jatayu — Data Connect queries
# =============================================================================
# Named read operations for the tables defined in ../schema/schema.gql.
# Each query becomes a type-safe function in the generated SDK.
#
# @auth levels:
#   PUBLIC      — anyone (used for published, public-facing content)
#   USER        — any signed-in Firebase Auth user (admin/editor reads)
#   NO_ACCESS   — callable only from admin SDK / server
#
# NOTE: field names follow the GraphQL type name, not the @table(name:) value.
#   e.g. type UseCase  -> query field `useCases`, type CaseStudy -> `caseStudies`.
# =============================================================================


# ----------------------------- Posts ----------------------------------------
query ListPublishedPosts @auth(level: PUBLIC) {
  posts(where: { status: { eq: "published" } }, orderBy: { publishedAt: DESC }) {
    id
    title
    slug
    excerpt
    category
    readTimeMinutes
    publishedAt
    heroImage {
      id
      url
      alt
    }
  }
}

query PostBySlug($slug: String!) @auth(level: PUBLIC) {
  posts(where: { slug: { eq: $slug }, status: { eq: "published" } }, limit: 1) {
    id
    title
    slug
    excerpt
    category
    readTimeMinutes
    publishedAt
    body
    heroImage {
      url
      alt
    }
  }
}


# ----------------------------- Products --------------------------------------
query ListPublishedProducts @auth(level: PUBLIC) {
  products(where: { status: { eq: "published" } }, orderBy: { order: ASC }) {
    id
    name
    slug
    eyebrow
    tagline
    conciseAnswer
    order
    featuredOnHome
  }
}

query ProductBySlug($slug: String!) @auth(level: PUBLIC) {
  products(where: { slug: { eq: $slug }, status: { eq: "published" } }, limit: 1) {
    id
    name
    slug
    eyebrow
    tagline
    conciseAnswer
    showPatientConsent
    primaryCtaLabel
    primaryCtaHref
    secondaryCtaLabel
    secondaryCtaHref
    seoTitle
    seoDescription
  }
}

query ProductIntroParagraphs($productId: UUID!) @auth(level: PUBLIC) {
  productIntroParagraphs(where: { productId: { eq: $productId } }, orderBy: { position: ASC }) {
    id
    text
    position
  }
}

query ProductDeploymentModes($productId: UUID!) @auth(level: PUBLIC) {
  productDeploymentModes(where: { productId: { eq: $productId } }, orderBy: { position: ASC }) {
    id
    title
    body
    position
