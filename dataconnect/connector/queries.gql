# ----------------------------- Leads (admin only) ----------------------------
query ListLeads @auth(level: USER) {
  leads(orderBy: { createdAt: DESC }) {
    id
    fullName
    workEmail
    phone
    role
    specialty
    hospitalOrCompany
    country
    status
    notes
    source
    createdAt
  }
}

query LeadsByStatus($status: String!) @auth(level: USER) {
  leads(where: { status: { eq: $status } }, orderBy: { createdAt: DESC }) {
    id
    fullName
    workEmail
    hospitalOrCompany
    country
    status
    createdAt
  }
}
