services:
  postgres:
    image: postgres:16-alpine
    container_name: jatayu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jatayu
      POSTGRES_PASSWORD: jatayu_dev_password
      POSTGRES_DB: jatayu_cms
    ports:
      - "5432:5432"
    volumes:
      - jatayu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jatayu -d jatayu_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jatayu_pgdata:
