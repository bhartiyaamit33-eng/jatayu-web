# Firebase App Hosting configuration
# Secrets (DATABASE_URI, PAYLOAD_SECRET) live in Cloud Secret Manager —
# only their names are referenced here, never their values.

runConfig:
  minInstances: 0
  maxInstances: 100
  cpu: 1
  memoryMiB: 1024
  concurrency: 80

env:
  # Public, build-time-inlined values (NEXT_PUBLIC_* are exposed to the browser)
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://jatayu-web--jatayu-company-website-a6a4c.asia-southeast1.hosted.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_LOGIN_URL
    value: https://jatayu-web--jatayu-company-website-a6a4c.asia-southeast1.hosted.app/admin
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_HERO_VIDEO_URL
    value: /voicedocai-hero-30s.mp4
    availability:
      - BUILD
      - RUNTIME

  # Secrets — resolved from Cloud Secret Manager at build & runtime
  - variable: DATABASE_URI
    secret: DATABASE_URI
    availability:
      - BUILD
      - RUNTIME
  - variable: PAYLOAD_SECRET
    secret: PAYLOAD_SECRET
    availability:
      - BUILD
      - RUNTIME
